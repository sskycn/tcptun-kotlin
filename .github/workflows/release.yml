name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate semantic version tag
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like vX.Y.Z, for example v0.5.2" >&2
            exit 1
          fi

          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if (( minor > 999 || patch > 999 )); then
            echo "Minor and patch versions must be no greater than 999" >&2
            exit 1
          fi

          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Tag produces an invalid Android versionCode: $version_code" >&2
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "version_name=${TAG#v}"
            echo "version_code=$version_code"
            if [[ "$TAG" == *-* ]]; then
              echo "prerelease=true"
            else
              echo "prerelease=false"
            fi
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.abi }} APK
    needs: validate-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
    env:
      TCPTUN_RELEASE_STORE_PASSWORD: ${{ secrets.TCPTUN_RELEASE_STORE_PASSWORD }}
      TCPTUN_RELEASE_KEY_ALIAS: ${{ secrets.TCPTUN_RELEASE_KEY_ALIAS }}
      TCPTUN_RELEASE_KEY_PASSWORD: ${{ secrets.TCPTUN_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TCPTUN_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || {
            echo "Missing repository secret TCPTUN_RELEASE_KEYSTORE_BASE64" >&2
            exit 1
          }
          keystore_path="$RUNNER_TEMP/tcptun-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "TCPTUN_RELEASE_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed architecture APK
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
          VERSION_NAME: ${{ needs.validate-tag.outputs.version_name }}
          VERSION_CODE: ${{ needs.validate-tag.outputs.version_code }}
          TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease \
            -PtargetAbi="$ABI" \
            -PreleaseVersionName="$VERSION_NAME" \
            -PreleaseVersionCode="$VERSION_CODE" \
            --no-daemon

          output_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$output_dir"
          apk="$output_dir/tcptun-${TAG}-${ABI}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          (cd "$output_dir" && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")

      - name: Upload architecture APK
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.abi }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - validate-tag
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download architecture APKs
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Create combined checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.apk > SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          name: ${{ needs.validate-tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.validate-tag.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.sha256
            dist/SHA256SUMS
