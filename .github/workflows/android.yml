name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-only:
    name: Android-only quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

  bridge:
    name: Build and verify Android Bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require private core read token
        env:
          TCPTUN_GO_READ_TOKEN: ${{ secrets.TCPTUN_GO_READ_TOKEN }}
        run: |
          [ -n "$TCPTUN_GO_READ_TOKEN" ] || {
            echo "TCPTUN_GO_READ_TOKEN is required for private tcptun-go checkout" >&2
            exit 1
          }
      - name: Read locked core revision
        id: bridge-lock
        shell: bash
        run: |
          sha="$(sed -n 's/^coreCommit=//p' bridge.lock)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "bridge.lock must contain a full 40-character coreCommit" >&2
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: gostartkit/tcptun-go
          ref: ${{ steps.bridge-lock.outputs.sha }}
          path: tcptun-go
          token: ${{ secrets.TCPTUN_GO_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: tcptun-go/go.mod
          cache-dependency-path: tcptun-go/go.sum
      - uses: gradle/actions/setup-gradle@v4
      - name: Install gomobile
        working-directory: tcptun-go
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260611195102-4dd8f1dbf5d2
          gomobile init
      - name: Build traceable AAR
        env:
          TCPTUN_GO_DIR: ${{ github.workspace }}/tcptun-go
          ALLOW_UNPINNED_BRIDGE: '0'
        run: ./scripts/build-androidbridge.sh
      - name: Verify Bridge metadata and Android contract compilation
        env:
          EXPECTED_CORE_COMMIT: ${{ steps.bridge-lock.outputs.sha }}
        run: ./gradlew :app:verifyAndroidBridge :app:compileDebugAndroidTestKotlin
      - uses: actions/upload-artifact@v4
        with:
          name: androidbridge-aar
          path: app/libs/androidbridge.aar
          if-no-files-found: error

  managed-device:
    name: VPN and Bridge instrumentation
    runs-on: ubuntu-latest
    needs: bridge
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: androidbridge-aar
          path: app/libs
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run critical instrumentation tests
        run: >-
          ./gradlew :app:tcptunCiApi35DebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.class=com.tcptun.client.VpnServiceLifecycleTest,com.tcptun.client.AndroidBridgeContractTest,com.tcptun.client.BridgeStatusJsonAndroidTest,com.tcptun.client.ProfileSecretSerializationAndroidTest,com.tcptun.client.DesiredRunningPlanStoreEncryptionTest,com.tcptun.client.DesiredRunningPlanMigrationAndroidTest,com.tcptun.client.SecretAtRestAndroidTest
