name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out pinned tcptun-go core
        uses: actions/checkout@v4
        with:
          repository: sskycn/tcptun-go
          ref: 7d0ef7f95af9e268d98c268a4bfe8c5f0895c3b4
          path: tcptun-go

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.5"
          cache-dependency-path: tcptun-go/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build pinned Android bridge
        shell: bash
        env:
          TCPTUN_GO_DIR: ${{ github.workspace }}/tcptun-go
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260611195102-4dd8f1dbf5d2
          gomobile init
          ./scripts/build-androidbridge.sh

      - name: Verify Android app
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
