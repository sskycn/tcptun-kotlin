wechat-qrcode-x8664 = { group = "com.github.jenly1314.WeChatQRCode", name = "opencv-x86_64", version.ref = "wechatQrCode" }
wechat-qrcode-detector = { group = "com.github.jenly1314.WeChatQRCode", name = "wechat-qrcode", version.ref = "wechatQrCode" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
