androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
wechat-qrcode-opencv = { group = "com.github.jenly1314.WeChatQRCode", name = "opencv", version.ref = "wechatQrCode" }
wechat-qrcode-arm64 = { group = "com.github.jenly1314.WeChatQRCode", name = "opencv-armv64", version.ref = "wechatQrCode" }
